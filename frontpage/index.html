<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi3B</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --bg-soft: #12151a;
    --line: #232a33;
    --text: #e8edf2;
    --muted: #8b97a5;
    --accent: #7dd3fc;
    --up: #4ade80;
    --down: #f87171;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 15% -10%, #17314a 0%, transparent 60%),
      radial-gradient(700px 400px at 100% 0%, #2a1733 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: clamp(24px, 6vw, 72px) 20px;
  }

  main {
    width: min(980px, 100%);
  }

  header { margin-bottom: clamp(24px, 5vw, 44px); }

  .eyebrow {
    margin: 0 0 8px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-size: clamp(40px, 9vw, 72px);
    line-height: 0.95;
    letter-spacing: -0.03em;
  }

  .sub {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  .sub code {
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
  }

  .card {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: linear-gradient(180deg, rgb(255 255 255 / 0.045), rgb(255 255 255 / 0.015));
    color: inherit;
    text-decoration: none;
    transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
  }

  .card:hover,
  .card:focus-visible {
    border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
    background: linear-gradient(180deg, rgb(255 255 255 / 0.07), rgb(255 255 255 / 0.02));
    transform: translateY(-2px);
    outline: none;
  }

  .glyph {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: rgb(125 211 252 / 0.1);
    color: var(--accent);
  }

  .glyph svg { width: 24px; height: 24px; }

  .body {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .name { font-size: 17px; font-weight: 650; }

  .desc { color: var(--muted); font-size: 13px; }

  .url {
    margin-top: 6px;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    overflow-wrap: anywhere;
  }

  .dot {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    opacity: 0.6;
  }

  .dot.up { background: var(--up); opacity: 1; }
  .dot.down { background: var(--down); opacity: 1; }

  footer {
    margin-top: clamp(28px, 5vw, 48px);
    color: var(--muted);
    font-size: 12px;
  }

  footer code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">Home server</p>
    <h1>pi3B</h1>
    <p class="sub">Web UIs on <code id="host">pi3B</code></p>
  </header>

  <section class="grid" aria-label="Services">
    <a class="card" data-service="opencode" data-path="/" href="#">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m8 8-4 4 4 4" />
          <path d="m16 8 4 4-4 4" />
          <path d="m13 5-2 14" />
        </svg>
      </span>
      <span class="body">
        <span class="name">OpenCode</span>
        <span class="desc">Web coding agent</span>
        <span class="url"></span>
      </span>
      <span class="dot" data-status title="Checking"></span>
    </a>

    <a class="card" data-service="novnc" data-path="/vnc.html?autoconnect=true&amp;resize=scale" href="#">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="12" rx="2" />
          <path d="M8 20h8" />
          <path d="M12 16v4" />
        </svg>
      </span>
      <span class="body">
        <span class="name">Desktop</span>
        <span class="desc">noVNC remote screen</span>
        <span class="url"></span>
      </span>
      <span class="dot" data-status title="Checking"></span>
    </a>

    <a class="card" data-service="gateway" data-path="/health" href="#">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" />
        </svg>
      </span>
      <span class="body">
        <span class="name">Gateway</span>
        <span class="desc">OpenAI-compatible API</span>
        <span class="url"></span>
      </span>
      <span class="dot" data-status title="Checking"></span>
    </a>
  </section>

  <footer>
    Served from <code id="footer-host">pi3B</code>.
  </footer>
</main>

<script>
  (() => {
    const host = location.hostname || "pi3B";
    document.getElementById("host").textContent = host;
    document.getElementById("footer-host").textContent = host;

    const FALLBACK = { opencode: 4096, novnc: 6080, gateway: 3456 };
    const cards = [...document.querySelectorAll("a.card[data-service]")];

    async function loadPorts() {
      try {
        const res = await fetch("frontpage.json", { cache: "no-store" });
        if (!res.ok) return FALLBACK;
        return { ...FALLBACK, ...(await res.json()) };
      } catch {
        return FALLBACK;
      }
    }

    function wire(card, port) {
      const path = card.dataset.path || "/";
      const url = "http://" + host + ":" + port + path;

      card.href = url;
      card.querySelector(".url").textContent = host + ":" + port;

      const dot = card.querySelector("[data-status]");
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 3500);

      fetch(url, { mode: "no-cors", cache: "no-store", signal: controller.signal })
        .then(() => {
          dot.classList.add("up");
          dot.title = "Online";
        })
        .catch(() => {
          dot.classList.add("down");
          dot.title = "Unreachable";
        })
        .finally(() => clearTimeout(timer));
    }

    loadPorts().then((ports) => {
      cards.forEach((card) => {
        const port = ports[card.dataset.service];
        if (port) wire(card, port);
      });
    });
  })();
</script>
</body>
</html>
