services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: free-web-ai-gateway
    restart: unless-stopped
    init: true
    environment:
      HOME: /config
      TFG_PORT: "3456"
      TFG_CDP_URL: "http://127.0.0.1:9222"
      TFG_API_KEY: ${TFG_API_KEY:?Set TFG_API_KEY in .env}
      TFG_MAX_PROMPT_CHARS: ${TFG_MAX_PROMPT_CHARS:-8000}
      TFG_REQUEST_TIMEOUT_SEC: ${TFG_REQUEST_TIMEOUT_SEC:-300}
    volumes:
      - gateway-data:/config
    depends_on:
      browser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3456/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: "service:browser"

  browser:
    build:
      context: ./browser
      dockerfile: Dockerfile
    image: free-web-ai-browser
    container_name: free-web-ai-browser
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Lisbon}
      CUSTOM_USER: ${BROWSER_USER:-admin}
      PASSWORD: ${BROWSER_PASSWORD:?Set BROWSER_PASSWORD in .env}
      CHROME_CLI: >-
        --remote-debugging-address=0.0.0.0
        --remote-debugging-port=9222
        --remote-allow-origins=*
    ports:
      - "${BROWSER_GUI_HOST_PORT:-6081}:3001"
      - "${GATEWAY_HOST_PORT:-3457}:3456"
    expose:
      - "9222"
    volumes:
      - browser-data:/config
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9222'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - free-web-ai-net

networks:
  free-web-ai-net:
    driver: bridge

volumes:
  gateway-data:
  browser-data:
